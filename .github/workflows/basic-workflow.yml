name: simple-workflow

on:
  push:
    branches:
      - main
      - deploy

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5
      - name: 🔨 Build
        run: echo "Building application..."

  publish:
    name: 📦 Publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5
      - name: 📤 Publishing
        run: echo "Publishing..."

  deploy:
    name: 🚀 Deploy
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5
      - name: 🌐 Deploying
        run: echo "Deploying to production..."
